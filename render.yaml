# Render Blueprint for the Tweets-App-Backend demo API (free tier).
# SQLite + seed-on-boot: the database file is created during the build and
# seeded with demo posts. The disk is ephemeral on the free tier, so posts
# created by visitors are lost when the service restarts — expected for a demo.
# No env vars need entering by hand: SECRET_KEY_BASE is generated by Render.
services:
  - type: web
    name: tweets-app-backend
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec rails s -p $PORT -e production
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SECRET_KEY_BASE
        generateValue: true
